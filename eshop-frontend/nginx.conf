server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — every unknown path serves index.html
    # React Router then reads the URL and renders the right page
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    # Cache static assets (JS/CSS/images) for 1 year
    # They have hashed filenames so cache-busting is automatic
    location ~* \.(js|css|png|jpg|jpeg|svg|ico|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}