version: 2

# Dependabot version updates are PAUSED (open-pull-requests-limit: 0 on all
# ecosystems below). This stops new automated PRs from being opened without
# deleting the schedule/config, so it can be re-enabled later by bumping the
# limits back up.
updates:
  # .NET NuGet packages
  - package-ecosystem: nuget
    directory: /EShopMicroservices
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - dotnet

  # Frontend npm packages
  - package-ecosystem: npm
    directory: /eshop-frontend
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - frontend

  # GitHub Actions versions
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - github-actions