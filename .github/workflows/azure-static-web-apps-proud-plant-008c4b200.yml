name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Read app version from package.json
        id: version
        run: echo "value=$(node -p "require('./eshop-frontend/package.json').version")" >> $GITHUB_OUTPUT

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        env:
          # Vite bakes VITE_* vars into the JS bundle at BUILD TIME.
          # Values are managed as GitHub Actions repository Variables
          # (repo Settings → Secrets and variables → Actions → Variables tab).
          # To change the API URL: update the variable in GitHub UI — no code change needed.
          VITE_API_CATALOG_URL: ${{ vars.VITE_API_CATALOG_URL }}
          VITE_API_CUSTOMER_URL: ${{ vars.VITE_API_CUSTOMER_URL }}
          VITE_API_ORDERING_URL: ${{ vars.VITE_API_ORDERING_URL }}
          VITE_API_IDENTITY_URL: ${{ vars.VITE_API_IDENTITY_URL }}
          # Read from package.json — bump "version" there to update the footer.
          # No workflow changes needed for future releases.
          VITE_APP_VERSION: ${{ steps.version.outputs.value }}
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PROUD_PLANT_008C4B200 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "eshop-frontend" # App source code path
          api_location: "" # Api source code path - optional
          output_location: "dist" # Built app content directory - optional
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PROUD_PLANT_008C4B200 }}
          action: "close"
