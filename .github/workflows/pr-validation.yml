name: PR Validation

on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: Validate .NET (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: |
          dotnet restore EShopMicroservices/Catalog.API/Catalog.API.csproj
          dotnet restore EShopMicroservices/Customer.API/Customer.API.csproj
          dotnet restore EShopMicroservices/Identity.API/Identity.API.csproj
          dotnet restore EShopMicroservices/Ordering.API/Ordering.API.csproj

      - name: Build
        run: |
          dotnet build EShopMicroservices/Catalog.API/Catalog.API.csproj --configuration Release --no-restore
          dotnet build EShopMicroservices/Customer.API/Customer.API.csproj --configuration Release --no-restore
          dotnet build EShopMicroservices/Identity.API/Identity.API.csproj --configuration Release --no-restore
          dotnet build EShopMicroservices/Ordering.API/Ordering.API.csproj --configuration Release --no-restore

      - name: Test with coverage
        run: |
          dotnet test EShopMicroservices/Catalog.Tests/Catalog.Tests.csproj --configuration Release --verbosity normal --collect "XPlat Code Coverage" --results-directory ./coverage
          dotnet test EShopMicroservices/Customer.Tests/Customer.Tests.csproj --configuration Release --verbosity normal --collect "XPlat Code Coverage" --results-directory ./coverage
          dotnet test EShopMicroservices/Identity.Tests/Identity.Tests.csproj --configuration Release --verbosity normal --collect "XPlat Code Coverage" --results-directory ./coverage
          dotnet test EShopMicroservices/Ordering.Tests/Ordering.Tests.csproj --configuration Release --verbosity normal --collect "XPlat Code Coverage" --results-directory ./coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: ./coverage

  frontend:
    name: Validate Frontend (tsc + vite build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: eshop-frontend/package-lock.json

      - name: Install
        working-directory: eshop-frontend
        run: npm ci

      - name: Build
        working-directory: eshop-frontend
        run: npm run build

  trivy:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: '1'
          severity: CRITICAL