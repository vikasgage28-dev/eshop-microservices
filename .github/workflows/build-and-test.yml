name: Build and Test

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop, main ]

jobs:
  build-and-test:
    name: Build & Test .NET App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore EShop.slnx

      - name: Build EShop Solution
        run: dotnet build EShop.slnx --no-restore --configuration Release

      - name: Run Unit Tests
        run: dotnet test EShop.slnx --no-build --configuration Release --verbosity normal