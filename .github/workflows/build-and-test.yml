name: Build and Test

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop, main ]

jobs:
  # Builds the legacy monolith — this is what runs in production (Azure App Service)
  # Switch this to EShopMicroservices.slnx only when a microservice is deployed and replaces legacy
  build-and-test:
    name: Build & Test Legacy Monolith
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore EShop.slnx

      - name: Build solution
        run: dotnet build EShop.slnx --no-restore --configuration Release

      - name: Run all tests
        run: dotnet test EShop.slnx --no-build --configuration Release --verbosity normal