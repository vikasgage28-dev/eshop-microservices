version: '3.8'

services:

  # ================================
  # SQL Server Service
  # ================================
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: eshop-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${SA_PASSWORD}
      - MSSQL_PID=Developer
    ports:
      - "${SQL_PORT}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - eshop-network
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${SA_PASSWORD}", "-Q", "SELECT 1", "-No"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ================================
  # EShop API Service
  # ================================
  eshop-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eshop-container
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENV}
      - ConnectionStrings__DefaultConnection=Server=${SQL_SERVER_NAME},1433;Database=${SQL_DATABASE};User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;
    ports:
      - "${API_PORT}:80"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - eshop-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

# ================================
# Volumes
# ================================
volumes:
  sqlserver_data:
    name: eshop-sqlserver-data

# ================================
# Networks
# ================================
networks:
  eshop-network:
    name: eshop-network
    driver: bridge