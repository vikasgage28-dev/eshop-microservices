version: '3.8'

services:

  # ================================
  # SQL Server Service
  # ================================
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: eshop-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Password123!
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - eshop-network
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "Password123!", "-Q", "SELECT 1", "-No"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ================================
  # EShop API Service
  # ================================
  eshop-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eshop-container
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=EShopDb;User Id=sa;Password=Password123!;TrustServerCertificate=True;
    ports:
      - "8080:80"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - eshop-network

# ================================
# Volumes
# ================================
volumes:
  sqlserver_data:
    name: eshop-sqlserver-data

# ================================
# Networks
# ================================
networks:
  eshop-network:
    name: eshop-network
    driver: bridge