apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-api
  namespace: eshop
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: customer-api
  template:
    metadata:
      labels:
        app: customer-api
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: eshop-sa
      containers:
        - name: customer-api
          image: acreshop2026.azurecr.io/eshop/customer-api:latest
          ports:
            - name: http
              containerPort: 5011
            - name: grpc
              containerPort: 5022
          envFrom:
            - configMapRef:
                name: customer-api-config
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 5011
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 5011
            initialDelaySeconds: 15
            periodSeconds: 10