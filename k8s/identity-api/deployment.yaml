apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-api
  namespace: eshop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: identity-api
  template:
    metadata:
      labels:
        app: identity-api
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: eshop-sa
      initContainers:
        - name: run-migrations
          image: acreshop2026.azurecr.io/eshop/identity-api:latest
          command: ["dotnet", "ef", "database", "update"]
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"

      containers:
        - name: identity-api
          image: acreshop2026.azurecr.io/eshop/identity-api:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: identity-api-config
          volumeMounts:
            - name: pem-keys
              mountPath: /app/private.pem
              subPath: private.pem
            - name: pem-keys
              mountPath: /app/public.pem
              subPath: public.pem
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: pem-keys
          secret:
            secretName: identity-pem-keys