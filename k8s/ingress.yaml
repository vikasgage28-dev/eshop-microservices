apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eshop-ingress
  namespace: eshop
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  rules:
    - http:
        paths:
          - path: /api/catalog
            pathType: Prefix
            backend:
              service:
                name: catalog-api
                port:
                  number: 80

          - path: /api/customers
            pathType: Prefix
            backend:
              service:
                name: customer-api
                port:
                  number: 80

          - path: /api/orders
            pathType: Prefix
            backend:
              service:
                name: ordering-api
                port:
                  number: 80

          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: identity-api
                port:
                  number: 80